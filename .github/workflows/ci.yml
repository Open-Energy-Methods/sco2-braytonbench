name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  co2-property-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,co2]'
      - name: CO2 EOS, published REFPROP and source comparison checks
        run: python -m pytest -q tests/test_coolprop_optional.py tests/test_co2_nist_reference.py tests/test_fr2016_co2_exploratory.py
      - name: Generate explicitly exploratory FR2016 comparison
        run: python scripts/fr2016_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr2016-conceptual-diagnostic
          path: evidence/generated/fr2016_conceptual_diagnostic.json
          if-no-files-found: ignore
