name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  co2-property-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,co2]' "CoolProp==8.0.0"
      - name: NIST reference + real CO2 EOS tests + conceptual FR2016 cycle
        run: python -m pytest -q tests/test_coolprop_optional.py tests/test_co2_nist_reference.py tests/test_co2_thermodynamic_consistency.py tests/test_fr2016_co2_exploratory.py
      - name: Generate FR2016 conceptual diagnostic
        run: python scripts/fr2016_diagnostic.py
      - name: Report discretization and near-critical input sensitivity
        run: python scripts/fr2016_sensitivity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr2016-reproducibility-evidence
          path: evidence/generated/*.json
          if-no-files-found: ignore
