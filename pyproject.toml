[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sco2-braytonbench"
version = "0.5.0a0"
description = "Independent auditable research prototype for recuperated sCO2 Brayton cycles"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Open Energy Methods"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]
dependencies = []

[project.optional-dependencies]
co2 = ["CoolProp>=6.6,<9"]
test = ["pytest>=8,<10", "tomli>=2,<3; python_version<'3.11'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
